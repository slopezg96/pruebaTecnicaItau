name: BookStore
options:
  bundleIdPrefix: com.slopezg96.bookstore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  BookStore:
    type: application
    platform: iOS
    sources:
      - path: BookStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopezg96.bookstore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: BookStore/App/Generated-Info.plist
      properties:
        UILaunchScreen: {}

  BookStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookStoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopezg96.bookstore.tests
    dependencies:
      - target: BookStore

schemes:
  BookStore:
    build:
      targets:
        BookStore: all
        BookStoreTests: [test]
    test:
      targets:
        - BookStoreTests
      commandLineArguments: {}
    run:
      config: Debug
