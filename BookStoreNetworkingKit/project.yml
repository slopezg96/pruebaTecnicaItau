name: BookStoreNetworkingKit
options:
  bundleIdPrefix: com.slopezg96.bookstore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEFINES_MODULE: YES
    SKIP_INSTALL: NO
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES

targets:
  BookStoreNetworkingKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: BookStoreNetworkingKit
        PRODUCT_BUNDLE_IDENTIFIER: com.slopezg96.bookstore.networkingkit
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
